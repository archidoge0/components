name: "ghav human: Release"
"on":
  push:
    branches:
      - ghav/dev/1547
    paths:
      - .ghav/human
permissions:
  id-token: write
  contents: read
jobs:
  a11yTest:
    name: Components a11y tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js 16
        uses: actions/setup-node@v3
        with:
          node-version: 16
      - run: npm install --force
      - run: npm run build
      - run: npm run test:a11y -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
